name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    # a versioned label, so Renovate offers the next Ubuntu as a PR that CI tests first; ubuntu-latest moves without one
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # alsa-sys and pipewire-sys link through pkg-config, bindgen needs libclang, openh264-sys2 assembles with nasm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libpipewire-0.3-dev libspa-0.2-dev libclang-dev nasm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --all-targets --locked -- -D warnings
      # tests/live.rs needs SteamVR, a GPU and a desktop, so it never runs here
      - run: cargo test --locked --lib --test config_reload --test setup_roundtrip
